kind = "video"
previewPath = "/__video"
title = "GovConnect Video"
description = "Nederlandstalige animatievideo (16:9, motion graphics) die GovConnect 2.0 presenteert: van losse lijstjes en mails naar één platform, met een tour langs de belangrijkste modules."
router = "path"

[agent]
videoAspectRatio = "16:9"

[[services]]
name = "web"
paths = [ "/__video" ]
localPort = 8090

[services.development]
run = "pnpm --filter @workspace/govconnect-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/govconnect-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/govconnect-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8090"
BASE_PATH = "/__video/"
