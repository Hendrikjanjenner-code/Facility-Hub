openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GovConnect 2.0 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tickets
  - name: reservations
  - name: visitors
  - name: vastgoed
  - name: assets
  - name: notifications
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/demo-accounts:
    get:
      operationId: listDemoAccounts
      tags: [auth]
      summary: List demo accounts per role (for the login screen)
      responses:
        "200":
          description: Demo accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoAccount"
  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List all users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets with optional filters
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: assigneeId
          in: query
          schema: { type: integer }
        - name: reporterId
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a ticket (self-service melding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket (status, assignee, priority, planning)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
  /tickets/{id}/comments:
    get:
      operationId: listTicketComments
      tags: [tickets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketComment"
    post:
      operationId: createTicketComment
      tags: [tickets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketComment"
  /ticket-categories:
    get:
      operationId: listTicketCategories
      tags: [tickets]
      summary: Categories with dynamic form field definitions and routing rules
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketCategory"
  /rooms:
    get:
      operationId: listRooms
      tags: [vastgoed]
      summary: List rooms with optional filters
      parameters:
        - name: floorId
          in: query
          schema: { type: integer }
        - name: buildingId
          in: query
          schema: { type: integer }
        - name: bookable
          in: query
          schema: { type: boolean }
        - name: minCapacity
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /rooms/{id}:
    get:
      operationId: getRoom
      tags: [vastgoed]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /structure:
    get:
      operationId: getStructure
      tags: [vastgoed]
      summary: Full vastgoedstructuur (organisatie > vestiging > gebouw > verdieping)
      responses:
        "200":
          description: Structure tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
  /reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List reservations with optional filters
      parameters:
        - name: date
          in: query
          schema: { type: string }
          description: "ISO date (YYYY-MM-DD)"
        - name: roomId
          in: query
          schema: { type: integer }
        - name: userId
          in: query
          schema: { type: integer }
        - name: kind
          in: query
          schema: { type: string }
          description: "room | workplace"
      responses:
        "200":
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          description: Time conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateReservation
      tags: [reservations]
      summary: Update reservation (status, check-in/out)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /workplaces:
    get:
      operationId: listWorkplaces
      tags: [reservations]
      summary: List bookable workplaces (flexplekken)
      parameters:
        - name: floorId
          in: query
          schema: { type: integer }
        - name: date
          in: query
          schema: { type: string }
          description: "When given, includes availability for that ISO date"
      responses:
        "200":
          description: Workplaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workplace"
  /catering-items:
    get:
      operationId: listCateringItems
      tags: [reservations]
      responses:
        "200":
          description: Catering items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CateringItem"
  /visitors:
    get:
      operationId: listVisitors
      tags: [visitors]
      parameters:
        - name: date
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Visitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visitor"
    post:
      operationId: createVisitor
      tags: [visitors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
  /visitors/{id}:
    patch:
      operationId: updateVisitor
      tags: [visitors]
      summary: Update badge status (check-in / check-out)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visitor"
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      parameters:
        - name: roomId
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Notifications for the current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Role-aware dashboard summary counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed (tickets, reservations, visitors)
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ApiMessage:
      type: object
      properties:
        message: { type: string }
      required: [message]
    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]
    DemoAccount:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        role: { type: string }
        roleLabel: { type: string }
      required: [email, name, role, roleLabel]
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role:
          type: string
          description: "eindgebruiker | servicedesk | facilitair_manager | cateraar | receptie | beheerder | leverancier"
        department: { type: ["string", "null"] }
        avatarColor: { type: ["string", "null"] }
      required: [id, email, name, role]
    TicketCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        defaultPriority: { type: string }
        routeToRole: { type: string }
        formFields:
          type: array
          description: Dynamic form field definitions for this category
          items:
            $ref: "#/components/schemas/FormField"
      required: [id, name, defaultPriority, routeToRole, formFields]
    FormField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        type:
          type: string
          description: "text | textarea | select | number | date | checkbox"
        required: { type: boolean }
        options:
          type: ["array", "null"]
          items: { type: string }
      required: [key, label, type, required]
    Ticket:
      type: object
      properties:
        id: { type: integer }
        number: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          description: "nieuw | in_behandeling | wacht_op_info | ingepland | gereed | gesloten"
        priority:
          type: string
          description: "P1 | P2 | P3 | P4"
        categoryId: { type: integer }
        categoryName: { type: ["string", "null"] }
        roomId: { type: ["integer", "null"] }
        roomName: { type: ["string", "null"] }
        buildingName: { type: ["string", "null"] }
        assetId: { type: ["integer", "null"] }
        assetName: { type: ["string", "null"] }
        reporterId: { type: integer }
        reporterName: { type: ["string", "null"] }
        assigneeId: { type: ["integer", "null"] }
        assigneeName: { type: ["string", "null"] }
        formData:
          type: ["object", "null"]
          additionalProperties: true
        slaDueAt: { type: ["string", "null"] }
        plannedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, number, title, description, status, priority, categoryId, reporterId, createdAt, updatedAt]
    TicketInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        categoryId: { type: integer }
        roomId: { type: ["integer", "null"] }
        assetId: { type: ["integer", "null"] }
        priority: { type: ["string", "null"] }
        formData:
          type: ["object", "null"]
          additionalProperties: true
      required: [title, description, categoryId]
    TicketUpdate:
      type: object
      properties:
        status: { type: string }
        priority: { type: string }
        assigneeId: { type: ["integer", "null"] }
        plannedAt: { type: ["string", "null"] }
        title: { type: string }
        description: { type: string }
    TicketComment:
      type: object
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        authorId: { type: integer }
        authorName: { type: ["string", "null"] }
        authorRole: { type: ["string", "null"] }
        body: { type: string }
        createdAt: { type: string }
      required: [id, ticketId, authorId, body, createdAt]
    TicketCommentInput:
      type: object
      properties:
        body: { type: string, minLength: 1 }
      required: [body]
    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        sites:
          type: array
          items:
            $ref: "#/components/schemas/Site"
      required: [id, name, sites]
    Site:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/Building"
      required: [id, name, city, buildings]
    Building:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        floors:
          type: array
          items:
            $ref: "#/components/schemas/Floor"
      required: [id, name, address, floors]
    Floor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        level: { type: integer }
        roomCount: { type: integer }
      required: [id, name, level, roomCount]
    Room:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        floorId: { type: integer }
        floorName: { type: ["string", "null"] }
        buildingId: { type: ["integer", "null"] }
        buildingName: { type: ["string", "null"] }
        siteName: { type: ["string", "null"] }
        functionType: { type: string }
        areaM2: { type: number }
        floorFinish: { type: ["string", "null"] }
        capacity: { type: ["integer", "null"] }
        bookable: { type: boolean }
        facilities:
          type: array
          items: { type: string }
        assetCount: { type: ["integer", "null"] }
        openTicketCount: { type: ["integer", "null"] }
      required: [id, name, code, floorId, functionType, areaM2, bookable, facilities]
    Reservation:
      type: object
      properties:
        id: { type: integer }
        kind:
          type: string
          description: "room | workplace"
        roomId: { type: ["integer", "null"] }
        roomName: { type: ["string", "null"] }
        workplaceId: { type: ["integer", "null"] }
        workplaceName: { type: ["string", "null"] }
        buildingName: { type: ["string", "null"] }
        userId: { type: integer }
        userName: { type: ["string", "null"] }
        title: { type: string }
        date: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        attendees: { type: ["integer", "null"] }
        setupBufferMin: { type: integer }
        cleanupBufferMin: { type: integer }
        status:
          type: string
          description: "bevestigd | ingecheckt | uitgecheckt | geannuleerd"
        cateringOrders:
          type: array
          items:
            $ref: "#/components/schemas/CateringOrderLine"
        createdAt: { type: string }
      required: [id, kind, userId, title, date, startTime, endTime, setupBufferMin, cleanupBufferMin, status, cateringOrders, createdAt]
    ReservationInput:
      type: object
      properties:
        kind: { type: string }
        roomId: { type: ["integer", "null"] }
        workplaceId: { type: ["integer", "null"] }
        title: { type: string, minLength: 1 }
        date: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        attendees: { type: ["integer", "null"] }
        setupBufferMin: { type: ["integer", "null"] }
        cleanupBufferMin: { type: ["integer", "null"] }
        cateringOrders:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/CateringOrderLineInput"
      required: [kind, title, date, startTime, endTime]
    ReservationUpdate:
      type: object
      properties:
        status: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        title: { type: string }
    CateringOrderLine:
      type: object
      properties:
        id: { type: integer }
        cateringItemId: { type: integer }
        itemName: { type: ["string", "null"] }
        quantity: { type: integer }
        unitPrice: { type: number }
      required: [id, cateringItemId, quantity, unitPrice]
    CateringOrderLineInput:
      type: object
      properties:
        cateringItemId: { type: integer }
        quantity: { type: integer }
      required: [cateringItemId, quantity]
    CateringItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        price: { type: number }
        category: { type: string }
      required: [id, name, price, category]
    Workplace:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        floorId: { type: integer }
        floorName: { type: ["string", "null"] }
        buildingName: { type: ["string", "null"] }
        zone: { type: string }
        features:
          type: array
          items: { type: string }
        available: { type: ["boolean", "null"] }
        bookedByName: { type: ["string", "null"] }
      required: [id, name, code, floorId, zone, features]
    Visitor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        company: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        hostId: { type: integer }
        hostName: { type: ["string", "null"] }
        visitDate: { type: string }
        expectedArrival: { type: string }
        badgeCode: { type: string }
        status:
          type: string
          description: "verwacht | aanwezig | vertrokken"
        checkedInAt: { type: ["string", "null"] }
        checkedOutAt: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, name, hostId, visitDate, expectedArrival, badgeCode, status, createdAt]
    VisitorInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        company: { type: ["string", "null"] }
