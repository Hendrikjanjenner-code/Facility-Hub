openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GovConnect 2.0 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tickets
  - name: reservations
  - name: visitors
  - name: vastgoed
  - name: assets
  - name: notifications
  - name: dashboard
  - name: contracts
  - name: shop
  - name: sustainability
  - name: mjop
  - name: Storage
  - name: knowledge
  - name: satisfaction
  - name: keys
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /auth/guest-login:
    post:
      operationId: guestLogin
      tags:
        - auth
      summary: Log in as a read-only guest with the shared guest password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestLoginInput'
      responses:
        '200':
          description: Logged in as guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid guest password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Log out
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      summary: Get current logged-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /contact-requests:
    post:
      operationId: createContactRequest
      tags:
        - contact
      summary: Submit a contact/interest request from the marketing site (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequestInput'
      responses:
        '201':
          description: Contact request received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
    get:
      operationId: listContactRequests
      tags:
        - contact
      summary: List contact requests (beheerder/facilitair manager only)
      responses:
        '200':
          description: Contact requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactRequest'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /users/me/preferences:
    put:
      operationId: updateMyPreferences
      tags:
        - auth
      summary: Update notification preferences for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferences'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid preference value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /auth/demo-accounts:
    get:
      operationId: listDemoAccounts
      tags:
        - auth
      summary: List demo accounts per role (for the login screen)
      responses:
        '200':
          description: Demo accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoAccount'
  /users:
    get:
      operationId: listUsers
      tags:
        - auth
      summary: List all users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /tickets:
    get:
      operationId: listTickets
      tags:
        - tickets
      summary: List tickets with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: assigneeId
          in: query
          schema:
            type: integer
        - name: reporterId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    post:
      operationId: createTicket
      tags:
        - tickets
      summary: Create a ticket (self-service melding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{id}:
    get:
      operationId: getTicket
      tags:
        - tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
    patch:
      operationId: updateTicket
      tags:
        - tickets
      summary: Update ticket (status, assignee, priority, planning)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /tickets/{id}/comments:
    get:
      operationId: listTicketComments
      tags:
        - tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketComment'
    post:
      operationId: createTicketComment
      tags:
        - tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCommentInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
  /ticket-categories:
    get:
      operationId: listTicketCategories
      tags:
        - tickets
      summary: Categories with dynamic form field definitions and routing rules
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketCategory'
  /rooms:
    get:
      operationId: listRooms
      tags:
        - vastgoed
      summary: List rooms with optional filters
      parameters:
        - name: floorId
          in: query
          schema:
            type: integer
        - name: buildingId
          in: query
          schema:
            type: integer
        - name: bookable
          in: query
          schema:
            type: boolean
        - name: minCapacity
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
  /rooms/{id}:
    get:
      operationId: getRoom
      tags:
        - vastgoed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /rooms/{id}/dossier-history:
    get:
      operationId: listRoomDossierHistory
      tags:
        - vastgoed
      summary: Wijzigingsgeschiedenis van het ruimtedossier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lijst van historieregels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomDossierHistoryEntry'
  /rooms/{id}/dossier-history/undo:
    post:
      operationId: undoRoomDossierChange
      tags:
        - vastgoed
      summary: Maak de laatste dossierwijziging ongedaan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bijgewerkte ruimte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /rooms/{id}/dossier-history/{entryId}/undo:
    post:
      operationId: undoRoomDossierEntry
      tags:
        - vastgoed
      summary: Draai één specifieke historieregel terug (velden die later zijn gewijzigd worden overgeslagen)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Terugdraaiing geslaagd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoRoomDossierEntryResult'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '409':
          description: Conflict (bijv. terugdraaiing van een terugdraaiing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /rooms/{id}/dossier:
    patch:
      operationId: updateRoomDossier
      tags:
        - vastgoed
      summary: Werk het ruimtedossier bij (facilitair_manager / beheerder)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomDossierUpdate'
      responses:
        '200':
          description: Bijgewerkte ruimte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /floors/{id}/plan:
    get:
      operationId: getFloorPlan
      tags:
        - vastgoed
      summary: Vlekkenplan-data voor een verdieping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vlekkenplan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorPlan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /floors/{id}/dossier-history:
    get:
      operationId: listFloorDossierHistory
      tags:
        - vastgoed
      summary: Recente herindelingen voor alle ruimtes op een verdieping (facilitair_manager / beheerder)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Herindelingshistorie
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FloorDossierHistoryEntry'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /buildings/{id}:
    get:
      operationId: getBuilding
      tags:
        - vastgoed
      summary: Gebouwdossier (gebouw, verdiepingen, kerncijfers)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gebouw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /buildings/{id}/documents:
    get:
      operationId: listBuildingDocuments
      tags:
        - vastgoed
      summary: Documenten van een gebouw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Documenten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuildingDocument'
    post:
      operationId: createBuildingDocument
      tags:
        - vastgoed
      summary: Registreer een geüpload document bij een gebouw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingDocumentInput'
      responses:
        '201':
          description: Document geregistreerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDocument'
  /building-documents/{id}:
    delete:
      operationId: deleteBuildingDocument
      tags:
        - vastgoed
      summary: Verwijder een gebouwdocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Verwijderd
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /keys:
    get:
      operationId: listKeys
      tags:
        - keys
      summary: Sleutels en passen (met huidige houder)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: overdue
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Sleutels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeySummary'
    post:
      operationId: createKey
      tags:
        - keys
      summary: Registreer een sleutel of pas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyInput'
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeySummary'
  /keys/{id}:
    get:
      operationId: getKey
      tags:
        - keys
      summary: Sleuteldossier met sleutelplan, uitgiftes en verliesmeldingen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sleuteldossier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
    patch:
      operationId: updateKey
      tags:
        - keys
      summary: Werk sleutelgegevens bij
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdate'
      responses:
        '200':
          description: Bijgewerkt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeySummary'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /keys/{id}/doors:
    post:
      operationId: createKeyDoor
      tags:
        - keys
      summary: Voeg een deur/cilinder toe aan het sleutelplan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyDoorInput'
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDoor'
  /key-doors/{id}:
    delete:
      operationId: deleteKeyDoor
      tags:
        - keys
      summary: Verwijder een deur/cilinder uit het sleutelplan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Verwijderd
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /keys/{id}/issue:
    post:
      operationId: issueKey
      tags:
        - keys
      summary: Geef een sleutel/pas uit aan een medewerker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyIssueInput'
      responses:
        '201':
          description: Uitgegeven
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '409':
          description: Sleutel niet beschikbaar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /keys/{id}/return:
    post:
      operationId: returnKey
      tags:
        - keys
      summary: Neem een uitgegeven sleutel/pas in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ingenomen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '409':
          description: Sleutel is niet uitgegeven
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /keys/{id}/issue-due:
    patch:
      operationId: updateKeyIssueDue
      tags:
        - keys
      summary: Pas de inleverdatum van de openstaande uitgifte aan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyIssueDueBody'
      responses:
        '200':
          description: Bijgewerkt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '404':
          description: Sleutel niet gevonden of geen openstaande uitgifte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '409':
          description: Sleutel is niet uitgegeven
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /keys/{id}/loss:
    post:
      operationId: reportKeyLoss
      tags:
        - keys
      summary: Meld een sleutel/pas als vermist (verliesprocedure met kostenverrekening en servicedesk-ticket)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyLossInput'
      responses:
        '201':
          description: Verlies geregistreerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
  /storage/document-uploads:
    post:
      tags:
        - Storage
      operationId: uploadStorageDocument
      summary: Upload een document (PDF of afbeelding, max 15 MB) naar private storage; bestandstype wordt server-side geverifieerd
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Bestand opgeslagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          description: Geen geldig document of bestand te groot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Upload mislukt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /sites/{id}:
    delete:
      operationId: deleteSite
      tags:
        - vastgoed
      summary: Verwijder een locatie inclusief alle gebouwen, documenten en storage-bestanden
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Locatie verwijderd
        '404':
          description: Locatie niet gevonden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
  /structure:
    get:
      operationId: getStructure
      tags:
        - vastgoed
      summary: Full vastgoedstructuur (organisatie > vestiging > gebouw > verdieping)
      responses:
        '200':
          description: Structure tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
  /reservations:
    get:
      operationId: listReservations
      tags:
        - reservations
      summary: List reservations with optional filters
      parameters:
        - name: date
          in: query
          schema:
            type: string
          description: ISO date (YYYY-MM-DD)
        - name: roomId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: kind
          in: query
          schema:
            type: string
          description: room | workplace
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
    post:
      operationId: createReservation
      tags:
        - reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '201':
          description: Created
