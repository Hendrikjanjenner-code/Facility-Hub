        roomId:
          type:
            - integer
            - 'null'
        roomName:
          type:
            - string
            - 'null'
        buildingName:
          type:
            - string
            - 'null'
        assetId:
          type:
            - integer
            - 'null'
        assetName:
          type:
            - string
            - 'null'
        reporterId:
          type: integer
        reporterName:
          type:
            - string
            - 'null'
        assigneeId:
          type:
            - integer
            - 'null'
        assigneeName:
