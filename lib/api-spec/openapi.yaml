      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        defaultPriority:
          type: string
        routeToRole:
          type: string
        formFields:
          type: array
          description: Dynamic form field definitions for this category
          items:
            $ref: '#/components/schemas/FormField'
      required:
        - id
        - name
        - defaultPriority
        - routeToRole
        - formFields
    FormField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          description: text | textarea | select | number | date | checkbox
        required:
          type: boolean
        options:
          type:
            - array
            - 'null'
          items:
            type: string
      required:
        - key
        - label
        - type
        - required
