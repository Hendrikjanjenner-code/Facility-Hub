components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    SendOrderToSupplierInput:
      type: object
      properties:
        supplierId:
          type: integer
      required:
        - supplierId
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    GuestLoginInput:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    ContactRequestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        organization:
          type: string
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
      required:
        - name
        - email
        - message
    ContactRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        organization:
          type:
            - string
            - 'null'
        message:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - message
        - createdAt
    DemoAccount:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
        roleLabel:
          type: string
      required:
        - email
        - name
        - role
        - roleLabel
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          description: eindgebruiker | servicedesk | facilitair_manager | cateraar | receptie | beheerder | leverancier
        department:
          type:
            - string
            - 'null'
        avatarColor:
          type:
            - string
            - 'null'
        notificationPreference:
          type: string
          description: "inapp_only | email | all"
          default: all
      required:
        - id
        - email
        - name
        - role
        - notificationPreference
    UpdateUserPreferences:
      type: object
      properties:
        notificationPreference:
          type: string
          description: "inapp_only | email | all"
      required:
        - notificationPreference
